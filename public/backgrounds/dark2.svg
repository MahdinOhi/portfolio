<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="none">
    <defs>
        <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="80" />
        </filter>
        
        <filter id="noise" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="turbulence"/>
            <feColorMatrix type="saturate" values="0" in="turbulence" result="grayscale"/>
        </filter>
    </defs>
    <g filter="url(#blur)">
        
            <defs>
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0077B6" />
                    <stop offset="100%" stop-color="#03045E" />
                </linearGradient>
            </defs>
            <rect width="800" height="600" fill="url(#bgGrad)" />
        <circle cx="533.6" cy="398.5" r="273.4" fill="#0077B6" opacity="0.70" style="mix-blend-mode: normal" /><circle cx="449.0" cy="229.2" r="283.9" fill="#00B4D8" opacity="0.70" style="mix-blend-mode: normal" /><circle cx="122.0" cy="406.2" r="270.1" fill="#90E0EF" opacity="0.70" style="mix-blend-mode: normal" /><circle cx="623.3" cy="532.9" r="243.1" fill="#CAF0F8" opacity="0.70" style="mix-blend-mode: normal" /><circle cx="89.4" cy="374.7" r="247.2" fill="#03045E" opacity="0.70" style="mix-blend-mode: normal" />
    </g>
    
</svg>